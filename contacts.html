<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ТехноМир — Контакты</title>
    <link rel="stylesheet" href="css/styles.min.css">
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <a class="logo" href="index.html">ТехноМир</a>
            <nav class="main-nav">
                <a href="index.html">Главная</a>
                <a href="catalog.html">Каталог</a>
                <a href="contacts.html">Контакты</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="page-title container">
            <h1>Контакты</h1>
            <p>Свяжитесь с нами удобным способом.</p>
        </section>

        <section class="contacts container">
            <div class="contact-card">
                <h2>Форма обратной связи</h2>
                <form>
                    <input type="text" placeholder="Ваше имя" required>
                    <input type="email" placeholder="Email" required>
                    <textarea rows="5" placeholder="Сообщение" required></textarea>
                    <button type="submit">Отправить</button>
                </form>
            </div>

            <div class="contact-card">
                <h2>Контакты</h2>
                <p>Телефон: +7 (999) 123-45-67</p>
                <p>Email: info@technomir.ru</p>
                <p>Адрес: г. Москва, ул. Примерная, д. 1</p>
                <img src="images/contact.webp" width="600" height="400" alt="Офис ТехноМир" loading="lazy">
            </div>

            <div class="contact-card">
                <h2>Мы на карте</h2>
                <iframe src="https://www.openstreetmap.org/export/embed.html?bbox=37.5%2C55.7%2C37.7%2C55.8&layer=mapnik" width="600" height="400" loading="lazy" title="Карта офиса"></iframe>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">© ТехноМир, 2026</div>
    </footer>

    <script src="js/main.min.js" defer></script>
</body>
</html>
