<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ТехноМир — Каталог</title>
    <link rel="stylesheet" href="css/styles.min.css">
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <a class="logo" href="index.html">ТехноМир</a>
            <nav class="main-nav">
                <a href="index.html">Главная</a>
                <a href="catalog.html">Каталог</a>
                <a href="contacts.html">Контакты</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="page-title container">
            <h1>Каталог товаров</h1>
            <p>Выберите технику для дома, учёбы и работы.</p>
        </section>

        <section class="catalog container">
            <div class="cards">
                <article class="product-card">
                    <img src="images/item1.webp" width="400" height="300" alt="Смартфон A1" loading="lazy">
                    <h3>Смартфон A1</h3>
                    <p>6.5″, 128 ГБ, камера 48 Мп.</p>
                    <a class="btn" href="contacts.html">Подробнее</a>
                </article>

                <article class="product-card">
                    <img src="images/item2.webp" width="400" height="300" alt="Ноутбук B2" loading="lazy">
                    <h3>Ноутбук B2</h3>
                    <p>15.6″, 16 ГБ ОЗУ, SSD 512 ГБ.</p>
                    <a class="btn" href="contacts.html">Подробнее</a>
                </article>

                <article class="product-card">
                    <img src="images/item3.webp" width="400" height="300" alt="Планшет C3" loading="lazy">
                    <h3>Планшет C3</h3>
                    <p>10.5″, 64 ГБ, Wi-Fi.</p>
                    <a class="btn" href="contacts.html">Подробнее</a>
                </article>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">© ТехноМир, 2026</div>
    </footer>

    <script src="js/main.min.js" defer></script>
</body>
</html>
